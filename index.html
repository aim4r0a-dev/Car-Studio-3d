canvas#dy{width:100%;height:210px;display:block;margin:8px 0}
@media(max-width:760px){#app{flex-direction:column}#view{flex:none;height:42%}#panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--b)}}

 if(st)st.innerHTML=`<div class=st><div><span>Tenaga mesin</span><b>${Math.round(pb)} HP</b></div><div><span>Kenaikan</span><b>+${gp.toFixed(0)}%</b></div><div><span>0–100 km/j (est.)</span><b>${t100.toFixed(1)} dtk</b></div><div><span>Top speed (est.)</span><b>${Math.round(vmax)} km/j</b></div><div><span>Boost</span><b>${psi} psi</b></div><div><span>Standar</span><b>${Math.round(pa)} HP</b></div></div><span style="font-size:12px;color:var(--m)">Beban mesin: ${lv[0]}</span><div class=bar><i style="width:${Math.min(100,gp/.8)}%;background:${lv[1]}"></i></div>`;
 drawDyno(dy.run?dy.p:1)}
function drawDyno(p){const c=$('#dy');if(!c)return;const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
 const st=curve(0),tu=curve(1),red=CARS[S.car][12],ym=Math.max(...tu.hp,...tu.tq,...st.tq)*1.1,Lm=34,Bm=22,Tm=8,Rm=8,css=getComputedStyle(document.documentElement);
 const X=r=>Lm+(r-1500)/(red-1500)*(w-Lm-Rm),Y=v=>h-Bm-v/ym*(h-Bm-Tm);
 x.font='10px sans-serif';x.fillStyle=css.getPropertyValue('--m').trim();
 for(let i=0;i<=4;i++){const y=Y(ym*i/4);x.strokeStyle=css.getPropertyValue('--b').trim();x.beginPath();x.moveTo(Lm,y);x.lineTo(w-Rm,y);x.stroke();x.fillText(Math.round(ym*i/4),2,y+3)}
 for(let r=2000;r<=red;r+=1000)x.fillText(r/1000+'k',X(r)-6,h-6);
 const ln=(d,k,col,dash,n)=>{x.beginPath();x.setLineDash(dash);x.strokeStyle=col;x.lineWidth=2;for(let i=0;i<n;i++){const px=X(d.r[i]),py=Y(d[k][i]);i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();x.setLineDash([])};
 const n=Math.max(2,Math.round(p*tu.r.length));ln(st,'hp','#e11d4866',[4,4],st.r.length);ln(st,'tq','#2563eb66',[4,4],st.r.length);ln(tu,'hp','#e11d48',[],n);ln(tu,'tq','#2563eb',[],n)}

// ---------- UI ----------
function field(f){if(f=='stats')return'<div id=stats></div>';const[k,l,t,o]=f,v=S[k];
 if(t=='s')return`<label>${l}<select data-k=${k}>${o.map((x,i)=>`<option value=${i} ${i==v?'selected':''}>${x}</option>`).join('')}</select></label>`;
 if(t=='c')return`<label>${l}<input type=color data-k=${k} value=${v}></label>`;
 if(t=='b')return`<label class=row><input type=checkbox data-k=${k} ${v?'checked':''}>${l}</label>`;
 return`<label>${l}: <b>${v}</b><input type=range data-k=${k} min=${o[0]} max=${o[1]} step=${o[2]} value=${v}></label>`}
function show(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.textContent==t));
 $('#pane').innerHTML=t=='Dyno'?`<button class=go id=run>▶ Jalankan tes dyno</button><label class=row style="margin-top:8px"><input type=checkbox id=snd checked>Suara mesin</label><canvas id=dy></canvas><div style="font-size:12px;color:var(--m)"><span style="color:#e11d48">━</span> Tenaga roda (HP) &nbsp;<span style="color:#2563eb">━</span> Torsi roda (Nm) &nbsp;┅ standar</div><div id=live class=st></div>`:TABS[t].map(field).join('');
 stats();if(t=='Dyno')live(0)}
$('#tabs').innerHTML=Object.keys(TABS).map(t=>`<button>${t}</button>`).join('');
$('#tabs').onclick=e=>e.target.tagName=='BUTTON'&&show(e.target.textContent);
$('#pane').oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;S[k]=t.type=='checkbox'?+t.checked:t.type=='color'?t.value:t.type=='range'?+t.value:t.tagName=='SELECT'?+t.value:t.value;
 const b=t.parentNode.querySelector('b');if(b)b.textContent=S[k];
 if(k=='car'){S.color=CARS[S.car][9];show(tab)}build();stats()};
function live(rpm){const el=$('#live');if(!el)return;const tu=curve(1),i=rpm?Math.max(0,Math.min(tu.r.length-1,Math.round((rpm-1500)/100))):tu.hp.indexOf(Math.max(...tu.hp));
 const pk=tu.hp.indexOf(Math.max(...tu.hp)),tq=tu.tq.indexOf(Math.max(...tu.tq));
 el.innerHTML=rpm?`<div><span>RPM</span><b>${Math.round(rpm)}</b></div><div><span>Tenaga roda</span><b>${tu.hp[i].toFixed(0)} HP</b></div>`:`<div><span>Puncak tenaga roda</span><b>${tu.hp[pk].toFixed(0)} HP @ ${tu.r[pk]}</b></div><div><span>Puncak torsi roda</span><b>${tu.tq[tq].toFixed(0)} Nm @ ${tu.r[tq]}</b></div>`}
let au,os;
$('#pane').onclick=e=>{if(e.target.id!='run')return;e.target.disabled=true;dy={run:1,t0:performance.now(),rpm:1500,p:0};
 if($('#snd').checked){try{au=au||new AudioContext();os=au.createOscillator();os.type='sawtooth';const f=au.createBiquadFilter();f.frequency.value=700;const g=au.createGain();g.gain.value=.05;os.connect(f);f.connect(g);g.connect(au.destination);os.start()}catch(_){os=null}}};

// ---------- loop ----------
function tick(t){requestAnimationFrame(tick);
 if(dy.run){const p=Math.min(1,(t-dy.t0)/6500),red=CARS[S.car][12];dy.p=p;dy.rpm=1500+(red-1500)*p;drawDyno(p);live(dy.rpm);os&&(os.frequency.value=dy.rpm/40+25);
  if(p>=1){dy.run=0;os&&os.stop();os=null;const b=$('#run');if(b)b.disabled=false;setTimeout(()=>live(0),900)}}
 const sp=dy.run?dy.rpm/6500*.5:0;W.forEach(s=>s.rotation.z-=sp);G.position.y=dy.run?Math.sin(t*.09)*.004*dy.rpm/6500:0;
 if(ST.length){const ph=Math.floor(t/110)%4;ST.forEach(o=>o.m.emissiveIntensity=(ph==o.i*2||ph==o.i*2+1&&0||ph==o.i*2)?3:.1);LT.forEach((l,i)=>l.intensity=(Math.floor(t/110)%4==i*2)?2:0)}
 if(S.spin)az+=.004;
 cam.position.set(Math.cos(az)*Math.cos(el)*dist,.5+Math.sin(el)*dist,Math.sin(az)*Math.cos(el)*dist);cam.lookAt(0,.55,0);R_.render(sc,cam)}
build();show('Mobil');requestAnimationFrame(tick);
</script></body></html>
